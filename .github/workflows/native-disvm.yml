# EN: Execute real native DisVM/Limbo ownership workloads on Linux64 targets.
# RU: Выполнять настоящие native-нагрузки владельцев DisVM/Limbo на Linux64.
name: Native DisVM Linux64

on:
    workflow_dispatch:
    push:
        branches: [experiment/no-nativeworld-exclusive]
        paths:
            - '.github/workflows/native-disvm.yml'
            - 'disVM/**'
            - 'flashVM/ports/**'
            - 'flashVM/include/**'
            - 'common/**'
            - 'tools/limbo-bootstrap/**'

permissions:
    contents: read

concurrency:
    group: native-disvm-${{ github.ref }}
    cancel-in-progress: true

jobs:
    native:
        name: Native ${{ matrix.backend }} (${{ matrix.instrumentation }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - backend: amd64
                      runner: ubuntu-24.04
                      instrumentation: plain
                      cflags: ''
                    - backend: arm64
                      runner: ubuntu-24.04-arm
                      instrumentation: plain
                      cflags: ''
                    - backend: amd64
                      runner: ubuntu-24.04
                      instrumentation: tsan
                      cflags: '-O1 -g -fsanitize=thread -fno-omit-frame-pointer'
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - name: Install build tools
              run: sudo apt-get update && sudo apt-get install -y build-essential cmake python3
            - name: Reserve a compatible TSan shadow address layout
              if: matrix.instrumentation == 'tsan'
              run: sudo sysctl -w vm.mmap_rnd_bits=28
            - name: Build the selected native backend
              run: >-
                  cmake -S disVM/runtime -B build/native -DDVM_RUNTIME_TESTS=ON
                  -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_FLAGS="${{ matrix.cflags }}"
                  && cmake --build build/native --parallel 4
            - name: Execute native C and JIT workloads
              run: >-
                  python3 disVM/runtime/native_arch_suite.py build/native
                  --expected ${{ matrix.backend }} --profile wide
            - name: Verify x64 constructor and channel oracle
              if: matrix.backend == 'amd64' && matrix.instrumentation == 'plain'
              run: ctest --test-dir build/native -R '^disvm_record_new$' --output-on-failure
            - name: Preserve complete workload logs and report
              if: always()
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: native-${{ matrix.backend }}-${{ matrix.instrumentation }}-wide
                  path: build/native/native-acceptance/wide
                  if-no-files-found: ignore
                  retention-days: 14

    rv64:
        name: RV64 userspace under QEMU
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        env:
            QEMU_LD_PREFIX: /usr/riscv64-linux-gnu
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
              with:
                  platforms: riscv64
            - name: Install RV64 cross toolchain
              run: >-
                  sudo apt-get update && sudo apt-get install -y
                  gcc-riscv64-linux-gnu libc6-dev-riscv64-cross cmake python3
            - name: Cross-build actual RV64 executables
              run: >-
                  cmake -S disVM/runtime -B build/native-rv64 -DDVM_RUNTIME_TESTS=ON
                  -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=riscv64
                  -DCMAKE_C_COMPILER=riscv64-linux-gnu-gcc -DCMAKE_BUILD_TYPE=RelWithDebInfo
                  && cmake --build build/native-rv64 --parallel 4
            - name: Execute RV64 C and JIT workloads under QEMU
              run: >-
                  python3 disVM/runtime/native_arch_suite.py build/native-rv64
                  --expected riscv64 --emulated --jobs 1 --profile wide
            - name: Preserve complete RV64 workload logs and report
              if: always()
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: native-riscv64-qemu-wide
                  path: build/native-rv64/native-acceptance/wide
                  if-no-files-found: ignore
                  retention-days: 14
